<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8" />
<title>HoloNFC · Proyector</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;            /* pure black for hologram */
    color: #fff;
    font-family: 'Archivo', system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #root {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: #000;
  }

  /* Both layers stacked, opacity-crossfade.
     Fast transition (150ms) so the swap is perceptually instant. */
  .layer {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    transition: opacity 150ms cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }
  .layer.show { opacity: 1; pointer-events: auto; }

  #idle  { opacity: 1; }   /* idle visible by default */

  .layer video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;          /* preserve aspect ratio */
    object-position: center;
    background: #000;
  }

  /* ─── UI overlay (only with ?ui=1) ─────────────────────────────────────── */
  body:not(.ui) .ui-only { display: none !important; }

  .idle-logo {
    position: relative;
    z-index: 1;
    text-align: center;
  }
  .idle-logo .mark {
    width: 60px; height: 60px;
    border: 3px solid rgba(255,255,255,0.3);
    position: relative;
    margin: 0 auto 20px;
  }
  .idle-logo .mark::before {
    content: ""; position: absolute; inset: 10px;
    border: 3px solid #4d7cff;
  }
  .idle-logo .mark::after {
    content: ""; position: absolute; inset: 22px;
    background: #4d7cff;
  }
  .idle-logo h1 {
    font: 900 48px/1 'Archivo', sans-serif;
    letter-spacing: -0.03em;
  }
  .idle-logo p {
    font: 500 14px/1 'JetBrains Mono', monospace;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.45);
    margin-top: 12px;
    text-transform: uppercase;
  }

  .live-badge {
    position: absolute; top: 22px; left: 24px;
    display: flex; align-items: center; gap: 7px;
    font: 500 10px/1 'JetBrains Mono', monospace;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.18em;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #4d7cff;
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

  .event-badge {
    position: absolute; top: 22px; right: 24px;
    font: 500 10px/1 'JetBrains Mono', monospace;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .name-overlay {
    position: absolute; left: 60px; right: 60px; bottom: 56px;
    color: #fff;
    animation: slideUp 250ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: none; }
  }
  .name-overlay .eyebrow {
    font: 500 12px/1 'JetBrains Mono', monospace;
    letter-spacing: 0.32em;
    opacity: 0.55;
    text-transform: uppercase;
  }
  .name-overlay h1 {
    font: 900 88px/0.95 'Archivo', sans-serif;
    letter-spacing: -0.03em;
    margin-top: 8px;
    word-break: break-word;
  }
  .name-overlay h1 span { color: #4d7cff; }
  .name-overlay .meta {
    font: 500 12px/1 'JetBrains Mono', monospace;
    letter-spacing: 0.18em;
    opacity: 0.55;
    margin-top: 14px;
    text-transform: uppercase;
  }
  .name-overlay .message {
    font: 400 italic 16px/1.3 'Archivo', sans-serif;
    opacity: 0.75;
    margin-top: 10px;
  }

  .progress-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(255,255,255,0.08);
  }
  .progress-bar__fill {
    height: 100%;
    background: #4d7cff;
    transition: width 200ms linear;
  }

  /* Hidden cache pool */
  #cache-pool {
    position: absolute;
    width: 0; height: 0;
    overflow: hidden;
    visibility: hidden;
  }

  /* ─── Fallback overlay (no video / processing / failed to load) ───────── */
  #fallback {
    position: absolute;
    inset: 0;
    background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 200ms ease;
    pointer-events: none;
    z-index: 5;
  }
  #fallback.show { opacity: 1; }
  .fb-ring {
    width: 120px; height: 120px;
    border: 3px solid rgba(77, 124, 255, 0.15);
    border-top-color: #4d7cff;
    border-radius: 50%;
    animation: fb-spin 1.5s linear infinite;
  }
  @keyframes fb-spin { to { transform: rotate(360deg); } }
  .fb-label {
    margin-top: 28px;
    font: 500 14px/1 'JetBrains Mono', monospace;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.35em;
    text-transform: uppercase;
  }
  .fb-pulse {
    margin-top: 10px;
    width: 80px; height: 2px;
    background: linear-gradient(90deg, transparent, #4d7cff, transparent);
    background-size: 200% 100%;
    animation: fb-pulse 1.8s ease-in-out infinite;
  }
  @keyframes fb-pulse {
    0%   { background-position: -100% 0; }
    100% { background-position:  100% 0; }
  }
</style>
</head>
<body>
<div id="root">

  <!-- IDLE -->
  <div id="idle" class="layer">
    <video id="idle-video" autoplay loop playsinline preload="auto"></video>
    <div class="idle-logo ui-only">
      <div class="mark"></div>
      <h1>HoloNFC</h1>
      <p id="event-name-idle">Evento · Bienvenidos</p>
    </div>
  </div>

  <!-- ACTIVE: guest hologram -->
  <div id="active" class="layer">
    <video id="guest-video" autoplay playsinline preload="auto"></video>
    <div class="live-badge ui-only"><span class="live-dot"></span>LIVE</div>
    <div class="event-badge ui-only" id="event-badge">HoloNFC</div>
    <div class="name-overlay ui-only" id="name-overlay" style="display:none">
      <div class="eyebrow">Bienvenido</div>
      <h1 id="guest-name"></h1>
      <div class="meta" id="guest-meta"></div>
      <div class="message" id="guest-message"></div>
    </div>
    <div class="progress-bar ui-only"><div class="progress-bar__fill" id="progress-fill" style="width:0"></div></div>
  </div>

  <!-- Hidden pool for video preloading -->
  <div id="cache-pool"></div>

  <!-- Fallback overlay (procesando / sin video / error de carga) -->
  <div id="fallback">
    <div class="fb-ring"></div>
    <div class="fb-label">Procesando</div>
    <div class="fb-pulse"></div>
  </div>

</div>

<script>
  const WS_URL = `ws://${location.hostname}:3000/ws`;
  const API    = `http://${location.hostname}:3000/api`;
  const VIDEO_BASE = `http://${location.hostname}:3000/videos/`;

  // Activate UI overlay with ?ui=1
  const params = new URLSearchParams(location.search);
  if (params.get('ui') === '1') document.body.classList.add('ui');

  let ws, reconnectTimer;
  let heartbeatInterval = null;
  let idleTimer = null;
  let progressTimer = null;
  let config = {};
  let unmuted = false;
  let lastCheckinUID = null;
  let lastCheckinTime = 0;
  const CHECKIN_DEBOUNCE_MS = 3000;

  // ── DOM refs ──────────────────────────────────────────────────────────────
  const idle          = document.getElementById('idle');
  const active        = document.getElementById('active');
  const idleVideo     = document.getElementById('idle-video');
  const guestVideo    = document.getElementById('guest-video');
  const nameOverlay   = document.getElementById('name-overlay');
  const guestName     = document.getElementById('guest-name');
  const guestMeta     = document.getElementById('guest-meta');
  const guestMessage  = document.getElementById('guest-message');
  const progressFill  = document.getElementById('progress-fill');
  const eventBadge    = document.getElementById('event-badge');
  const eventNameIdle = document.getElementById('event-name-idle');
  const cachePool     = document.getElementById('cache-pool');
  const fallback      = document.getElementById('fallback');

  function showFallback(label) {
    fallback.querySelector('.fb-label').textContent = label || 'Procesando';
    fallback.classList.add('show');
  }
  function hideFallback() {
    fallback.classList.remove('show');
  }

  // Report uncaught JS errors to the backend so the admin sees them
  window.addEventListener('error', (ev) => {
    try {
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'PROJECTOR_ERROR', error: String(ev.message || ev.error || 'unknown') }));
      }
    } catch {}
  });

  // Start muted (browser autoplay policy)
  idleVideo.muted  = true;
  guestVideo.muted = true;
  console.log('[projector] DOM ready, ui mode:', document.body.classList.contains('ui'));

  // ── Video preload pool ───────────────────────────────────────────────────
  // Keeps a hidden <video preload="auto"> for every assigned guest video so
  // the browser caches it. When a tag is scanned, the file is already buffered.
  const cached = new Set();

  function preloadVideo(filename) {
    if (!filename || cached.has(filename)) return;
    cached.add(filename);
    const v = document.createElement('video');
    v.src = VIDEO_BASE + filename;
    v.preload = 'auto';
    v.muted = true;
    v.playsInline = true;
    cachePool.appendChild(v);
    console.log('[projector] preloading:', filename);
  }

  async function preloadAllGuestVideos() {
    try {
      const guests = await fetch(`${API}/guests?limit=2000`).then(r => r.json());
      const rows = guests.rows || guests || [];
      const unique = new Set(rows.map(g => g.video).filter(Boolean));
      console.log(`[projector] preloading ${unique.size} guest video(s)`);
      unique.forEach(preloadVideo);
    } catch (e) {
      console.error('[projector] preload guests failed:', e);
    }
  }

  // ── Config ────────────────────────────────────────────────────────────────
  async function loadConfig() {
    try {
      config = await fetch(`${API}/config`).then(r => r.json());
      console.log('[projector] config:', config);
      if (config.idle_video) {
        const newSrc = VIDEO_BASE + config.idle_video;
        if (!idleVideo.src.endsWith(config.idle_video)) {
          idleVideo.src = newSrc;
          idleVideo.loop = true;
        }
        idleVideo.muted = !unmuted;
        idleVideo.play().catch(err => console.error('[projector] idle play:', err));
      } else {
        idleVideo.src = '';
      }
      if (config.event_name) {
        eventNameIdle.textContent = config.event_name;
        eventBadge.textContent = config.event_name.toUpperCase();
      }
    } catch(e) {
      console.error('[projector] loadConfig error:', e);
    }
  }

  // ── Show / Hide ───────────────────────────────────────────────────────────
  function showIdle() {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    if (idleTimer)     { clearTimeout(idleTimer);     idleTimer     = null; }
    guestVideo.onended = null;
    guestVideo.onerror = null;
    hideFallback();

    // Bring idle back to foreground
    idle.classList.remove('hidden');
    active.classList.remove('show');

    // Resume idle video
    if (idleVideo.paused) {
      idleVideo.play().catch(e => console.warn('[projector] idle play:', e));
    }

    // Clean up guest video shortly after fade-out completes
    setTimeout(() => {
      guestVideo.pause();
      guestVideo.removeAttribute('src');
      guestVideo.load();
      nameOverlay.style.display = 'none';
    }, 200);
  }

  function showGuest(guest) {
    // Reset progress + timers
    progressFill.style.width = '0';
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    if (idleTimer)     { clearTimeout(idleTimer);     idleTimer     = null; }

    // Text overlay (only visible if ?ui=1)
    const [firstName, ...rest] = (guest.name || '').split(' ');
    const lastName = rest.join(' ');
    guestName.innerHTML = lastName
      ? `${firstName}<br><span>${lastName}</span>`
      : `<span>${firstName}</span>`;
    const meta = [
      guest.table_num ? `Mesa ${guest.table_num}` : null,
      config.event_name || null,
    ].filter(Boolean).join('  ·  ');
    guestMeta.textContent = meta;
    guestMessage.textContent = guest.message ? `«${guest.message}»` : '';
    nameOverlay.style.display = 'block';

    const hasVideo = !!guest.video;
    const FALLBACK_DURATION = 6000;

    function reveal() {
      // Start guest video timer + crossfade
      active.classList.add('show');

      // Pause idle video to prevent audio overlap
      if (!idleVideo.paused) {
        idleVideo.pause();
      }

      const startTs = Date.now();
      progressTimer = setInterval(() => {
        let pct;
        if (hasVideo && guestVideo.duration && isFinite(guestVideo.duration)) {
          pct = (guestVideo.currentTime / guestVideo.duration) * 100;
        } else {
          pct = ((Date.now() - startTs) / FALLBACK_DURATION) * 100;
        }
        progressFill.style.width = Math.min(100, Math.max(0, pct)) + '%';
      }, 80);
    }

    if (hasVideo) {
      const src = VIDEO_BASE + guest.video;
      guestVideo.muted = !unmuted;

      guestVideo.onended = () => {
        console.log('[projector] guest video ended');
        showIdle();
      };

      // If the video file is missing or fails to load → fallback overlay
      const onLoadError = () => {
        console.warn('[projector] guest video failed to load → fallback');
        showFallback('Procesando');
        reveal();
        idleTimer = setTimeout(showIdle, FALLBACK_DURATION);
      };
      guestVideo.onerror = onLoadError;

      const onReady = () => {
        guestVideo.removeEventListener('canplaythrough', onReady);
        guestVideo.removeEventListener('canplay', onReady);
        hideFallback();
        guestVideo.currentTime = 0;
        guestVideo.play().catch(e => console.warn('[projector] guest play:', e));
        reveal();
      };
      guestVideo.addEventListener('canplaythrough', onReady, { once: true });
      guestVideo.addEventListener('canplay', onReady, { once: true });
      // If neither fires within 1.5 s, assume the file is missing → fallback
      const safetyTimer = setTimeout(() => {
        if (!active.classList.contains('show')) {
          if (guestVideo.readyState >= 2) onReady();
          else onLoadError();
        }
      }, 1500);

      if (guestVideo.src !== src) guestVideo.src = src;
      else { clearTimeout(safetyTimer); guestVideo.currentTime = 0; onReady(); }
    } else {
      // No video assigned → fallback overlay
      showFallback('Procesando');
      reveal();
      idleTimer = setTimeout(showIdle, FALLBACK_DURATION);
    }
  }

  // ── WebSocket ─────────────────────────────────────────────────────────────
  function connect() {
    try { ws = new WebSocket(WS_URL); } catch(e) { scheduleReconnect(); return; }

    ws.onopen = () => {
      console.log('[projector] WS connected');
      // Identify as projector
      ws.send(JSON.stringify({ type: 'HELLO', role: 'projector' }));
      // Start heartbeat
      if (heartbeatInterval) clearInterval(heartbeatInterval);
      heartbeatInterval = setInterval(() => {
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: 'PING', state: active.classList.contains('show') ? 'guest' : 'idle' }));
        }
      }, 5_000);
      loadConfig();
      preloadAllGuestVideos();
    };

    ws.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        console.log('[projector] WS msg:', data.type);

        if (data.type === 'TAG_READ' && data.guest && data.checkinType !== 'UNKNOWN') {
          const now = Date.now();
          if (data.uid === lastCheckinUID && now - lastCheckinTime < CHECKIN_DEBOUNCE_MS) {
            console.log('[projector] duplicate TAG_READ ignored');
          } else {
            lastCheckinUID  = data.uid;
            lastCheckinTime = now;
            showGuest(data.guest);
          }
        }

        if (data.type === 'CONFIG_UPDATED') {
          loadConfig();
          preloadAllGuestVideos();  // refresh cache pool in case videos changed
        }

        if (data.type === 'RELOAD') {
          console.warn('[projector] received RELOAD from server');
          location.reload();
        }
      } catch(err) {
        console.error('[projector] WS msg parse error:', err);
      }
    };

    ws.onclose = () => {
      console.warn('[projector] WS closed');
      if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
      scheduleReconnect();
    };
    ws.onerror = () => ws.close();
  }

  function scheduleReconnect() {
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 3000);
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  loadConfig();
  preloadAllGuestVideos();
  connect();

  // Unlock audio + enter fullscreen on first click
  function unlockAudio() {
    if (!unmuted) {
      unmuted = true;
      idleVideo.muted  = false;
      guestVideo.muted = false;
      console.log('[projector] audio unlocked');
      if (idleVideo.src && idleVideo.paused)   idleVideo.play().catch(() => {});
      if (guestVideo.src && guestVideo.paused) guestVideo.play().catch(() => {});
    }
  }
  document.addEventListener('click', () => {
    unlockAudio();
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  });
  document.addEventListener('keydown', unlockAudio, { once: true });
</script>
</body>
</html>
